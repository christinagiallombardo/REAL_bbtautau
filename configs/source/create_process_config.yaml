# =====================================================================================
# create_process_config.yaml
#
# User-facing settings for the fake-factor process configs in channels:
#     QCD.yaml, Wjets.yaml, WjetsMC.yaml, ttbarMC.yaml
#
# Fill in the sections below, then run:
#     python scripts/make_configs.py            (or --only processes for just these files)
# The baseline cut strings and the iso / anti-iso selections of each process are built from them.
# The values given here reproduce the current configs.
#
# Conventions
#   - Cuts are pandas-query strings, as in the generated configs.
#   - {min: a, max: b} ranges are strict:  a < x < b.  Leave a side out for no bound.
#   - {index}, {tau_index}, {tau_other_index}, {baseline}, {era}, {channel}, {region}
#     are placeholders filled by the framework; leave them as they are.
#   - Paths are relative to storage.real_base in create_project_config.yaml.
# =====================================================================================


# -------------------------------------------------------------------------------------
# 1. Branch names: replace with how each quantity is called in your ntuples / framework
# -------------------------------------------------------------------------------------
branches:
  # Say how you define opposite-sign vs same-sign events.
  charge:
    name: isOS
    opposite_sign: 1
    same_sign: 0

  # Define working points (DeepTau, ParticleNet, UParT). {index} is replaced by the leg number (1, 2) defined elsewhere
  tau_id:
    wp_jet: dau{index}_rawDeepTau2018v2p5VSjet
    wp_ele: dau{index}_rawDeepTau2018v2p5VSe
    wp_mu: dau{index}_rawDeepTau2018v2p5VSmu

  lepton_iso: dau1_pfRelIso04_all         # relative isolation of the light lepton (mt, et)
  electron_id: e_pass90_1      # electron ID flag (et)
  mt: mT                    # transverse mass
  n_bjets: n_bjets
  wjets_score: Wjets_pred_score
  gen_match: dau{index}_genPartFlav  # 0 = jet -> tau fake
  preweight: genWeight * puWeight * topKinWeight * idAndIsoAndFakeSF  # define total weight for scaling in preprocessing step
  weight: wt_sf                # event weight; its sign splits mc_* and mc_*_neg
  extra: pairType


# -------------------------------------------------------------------------------------
# 1b. Ntuple categories
#    With loop: true, each sample is read from every category listed under names, and preprocessing
#    writes one parquet file per category, e.g. data_all_events_Run3_2024_cat_res1b.parquet. In eras.<era>.sample_path (create_project_config.yaml),
#    {category} is replaced by each category name and {file} by that category's ROOT file, e.g.
#        sample_path: "{sample}/{category}/Prod_26_04/{file}"
#    The file can be a single name, a glob pattern (data_[0-9]*.root) or a list of these.
#    With loop: false, the {category} level is removed from sample_path, so the example above reads
#    "{sample}/Prod_26_04/{file}", and {file} is replaced by file below.
# -------------------------------------------------------------------------------------
ntuple_categories:
  loop: true
  file: data_0.root            # ROOT file used when loop is false
  names:
    cat_res1b: data_0.root
    cat_res2b: data_0.root

# -------------------------------------------------------------------------------------
# 2. Era groups
#    Define naming of eras.
# -------------------------------------------------------------------------------------
era_groups:
  EarlyRun3: [Run3_2022, Run3_2022EE, Run3_2023, Run3_2023BPix]
  Run3_2024: [Run3_2024]

# Processes with split_by_era_group: false get one categories block shared by all eras.
# Any era-dependent setting (per-group trigger cuts, era_group_overrides) is taken from
# this group for them. Only set split_by_era_group: false if those settings are the same across groups.
default_era_group: EarlyRun3


# -------------------------------------------------------------------------------------
# 3. Triggers per channel
#    Define the triggers used in each channel and the cuts to apply.
# -------------------------------------------------------------------------------------
triggers:
  tt:
    doubletau:
      flag: HLT_DoublePNetTauhPFJet30_Medium_L2NN_eta2p3
      cuts:
        EarlyRun3: ["dau1_pt > 40", "dau2_pt > 40"]
        Run3_2024: ["dau1_pt > 35", "dau2_pt > 35"]
    doubletauandjet:
      flag: HLT_DoublePNetTauhPFJet26_L2NN_eta2p3_PFJet60
      cuts:
        EarlyRun3: ["dau1_pt > 35", "dau2_pt > 35", "dau1_pt < 190", "dau2_pt < 190", "vbfjet1_pt > 60"]
        Run3_2024: ["dau1_pt > 31", "dau2_pt > 31", "dau1_pt < 140", "dau2_pt < 140", "vbfjet1_pt > 60"]

  mt:
    mt_cross:
      flag: HLT_IsoMu20_eta2p1_PNetTauhPFJet27_Loose_eta2p3_CrossL1
      cuts: ["dau1_pt > 21", "dau1_pt <= 26", "abs(dau1_eta) < 2.1", "dau2_pt > 32", "abs(dau2_eta) < 2.1"]
    singlemuon:
      flag: HLT_IsoMu24
      cuts: ["dau1_pt > 26", "abs(dau1_eta) < 2.4"]

  et:
    singleelectron:
      flag: HLT_Ele30_WPTight_Gsf
      cuts: ["dau1_pt > 31", "abs(dau1_eta) < 2.1"]


# -------------------------------------------------------------------------------------
# 4. Tau ID working points
# -------------------------------------------------------------------------------------
# VSjet cuts per channel:
#   isolated (iso):       VSjet > iso_min
#   anti-isolated (aiso): low <= VSjet <= high   (antiiso_range: [low, high], inclusive)
# With iso_inclusive: true the iso_min boundary belongs to iso instead:
#   iso:  VSjet >= iso_min      aiso: low <= VSjet < high      not_iso: VSjet < iso_min
# Current WPs: iso = Medium (0.9600), aiso = VVVLoose (0.3569) <= VSjet < Medium.
tau_vs_jet: {iso_min: 0.9600, antiiso_range: [0.3569, 0.9600], iso_inclusive: true}

# Anti-lepton working points applied in every region of a channel: {leg: WP}, cut is >=.
anti_lepton:
  tt:
    wp_ele: {1: 0.1754, 2: 0.1754}
    wp_mu: {1: 0.4432, 2: 0.3569}
  mt:
    wp_ele: {2: 0.5910}
    wp_mu: {2: 0.9360}
  et:
    wp_ele: {2: 0.1754}
    wp_mu: {2: 0.9360}


# -------------------------------------------------------------------------------------
# 5. Processes
#
#  Region options (per channel), all optional:
#    charge:       opposite_sign | same_sign             (omit = no charge cut)
#    other_tau:    iso | antiiso | not_iso    VSjet of the other tau, tt only
#                  (not_iso = VSjet <= iso_min, without the antiiso lower bound)
#    lepton_iso:   {min, max}       on branches.lepton_iso
#    electron_id:  pass | fail      on branches.electron_id (omit = no cut)
#    mt:           {min, max}       on branches.mt
#    bjet_veto:    true             n_bjets == 0
#    wjets_score:  {min, max}       on branches.wjets_score
#    extra:        value            branches.extra == value, e.g. extra: "0" -> (pairType == 0)
#                  [cut, ...]       or a list of complete cuts, AND'ed to the baseline
#  Cuts are written in the order the options are given here, followed by the
#  anti-lepton IDs and the triggers of the channel (always added).
#
#  Selections:
#    samples:       which of data / mc to write (data_iso, data_aiso, mc_iso, mc_aiso,
#                   mc_iso_neg, mc_aiso_neg)
#    mc_gen_match:  condition on gen_match of the measured tau in MC
#                   ("!= 0" = genuine taus/leptons, subtracted from data;
#                    "== 0" = jet fakes, used directly)
#
#  era_group_overrides: per era group, region and channel, keys that replace the ones above.
# -------------------------------------------------------------------------------------
processes:

  QCD:
    input_folder: processed/{era}/{channel}_QCD/
    input_files:
      mc: mc_all_events_{era}.parquet
      data: data_all_events_{era}.parquet
    output_dir: post_processed/{era}/{region}_region/QCD/
    split_by_era_group: true
    # tt, subleading pass (measured tau = dau2, other tau = dau1); genPartFlav != 0 is on MC only:
    #   SS iso    = determination data_iso:  isOS == 0, dau1 >= Medium, dau2 >= Medium
    #   SS inviso = determination data_aiso: isOS == 0, dau1 >= Medium, VVVLoose <= dau2 < Medium
    #   OS iso    = validation data_iso:     isOS == 1, dau1 >= Medium, dau2 >= Medium
    #   OS inviso = validation data_aiso:    isOS == 1, dau1 >= Medium, VVVLoose <= dau2 < Medium
    regions:
      determination:
        tt: {charge: same_sign, other_tau: iso, extra: "2"}
        mt: {charge: same_sign, mt: {max: 65}, lepton_iso: {min: 0.05, max: 0.15}, extra: "0"}
        et: {charge: same_sign, mt: {max: 65}, electron_id: pass, lepton_iso: {min: 0.05, max: 0.15}, extra: "1"}
      validation:
        tt: {charge: opposite_sign, other_tau: iso, extra: "2"}
        mt: {charge: same_sign, mt: {max: 65}, lepton_iso: {min: 0.25, max: 0.5}, extra: "0"}
        et: {charge: same_sign, mt: {max: 65}, electron_id: pass, lepton_iso: {min: 0.25, max: 0.5}, extra: "1"}
    era_group_overrides:
      # Reproduces the current EarlyRun3 et validation region (failing electron ID, no lower iso bound).
      # Differs from Run3_2024; check whether this is intended.
      EarlyRun3:
        validation:
          et: {electron_id: fail, lepton_iso: {max: 0.5}}
    selections:
      samples: [data, mc]
      mc_gen_match: "!= 0"

  Wjets:
    input_folder: processed/{era}/{channel}_Wjets/
    input_files:
      mc: mc_all_events_{era}.parquet
      data: data_all_events_{era}.parquet
    output_dir: data_January26/{era}/{region}_region/Wjets/
    split_by_era_group: false
    regions:
      determination:
        mt: {charge: opposite_sign, wjets_score: {min: 0.15}, mt: {min: 65}, bjet_veto: true, lepton_iso: {max: 0.15}, extra: "0"}
        et: {charge: opposite_sign, wjets_score: {min: 0.15}, electron_id: pass, mt: {min: 65}, bjet_veto: true, lepton_iso: {max: 0.15}, extra: "1"}
    selections:
      samples: [data, mc]
      mc_gen_match: "!= 0"

  WjetsMC:
    input_folder: processed/{era}/{channel}_WjetsMC/
    input_files:
      mc: mc_all_events_{era}.parquet
    output_dir: data_January26/{era}/{region}_region/WjetsMC/
    split_by_era_group: false
    regions:
      determination:
        mt: {charge: opposite_sign, wjets_score: {min: 0.15}, mt: {min: 65}, bjet_veto: true, lepton_iso: {max: 0.15}, extra: "0"}
        et: {charge: opposite_sign, wjets_score: {min: 0.15}, electron_id: pass, mt: {min: 65}, bjet_veto: true, lepton_iso: {max: 0.15}, extra: "1"}
      validation:
        mt: {charge: opposite_sign, wjets_score: {min: 0.15}, mt: {max: 65}, bjet_veto: true, lepton_iso: {max: 0.15}, extra: "0"}
        et: {charge: opposite_sign, wjets_score: {min: 0.15}, electron_id: pass, mt: {max: 65}, bjet_veto: true, lepton_iso: {max: 0.15}, extra: "1"}
    selections:
      samples: [mc]
      mc_gen_match: "== 0"

  ttbarMC:
    input_folder: processed/{era}/{channel}_ttbarMC/
    input_files:
      mc: mc_all_events_{era}.parquet
    output_dir: data_January26/{era}/{region}_region/ttbarMC
    split_by_era_group: false
    regions:
      determination:
        mt: {charge: opposite_sign, lepton_iso: {max: 0.15}, extra: "0"}
        et: {charge: opposite_sign, lepton_iso: {max: 0.15}, extra: "1"}
    selections:
      samples: [mc]
      mc_gen_match: "== 0"
