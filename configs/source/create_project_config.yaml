# Storage locations, eras and sample names. Analysis settings are in configs/source/.
# scripts/make_configs.py builds configs/ from this file and configs/source/create_*_config.yaml.
# Relative path values under configs/source/ are resolved against storage.real_base.
# real_base "./" means the REAL repository this file is in.
#
# Input files of a sample are found at <ntuple_dir>/<sample_path>, where {sample} in sample_path is
# replaced by the sample name. sample_path can be a directory (all *.root files in it are used),
# a single file, or a glob pattern, e.g. "{sample}/cat_res1b/Prod_26_04/data_[0-9]*.root".
# To read several categories, write {category} and {file} in sample_path and list the categories and
# their files under ntuple_categories in create_process_config.yaml.
storage:
  real_base: /eos/user/c/cgiallom/REAL_test
  fake_factor_base: path_to_classical_fake_factor # if this is not set, the classical fake factor method is disabled -- need to add to MUFFIN tools to make this work
